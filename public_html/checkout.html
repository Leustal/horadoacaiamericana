<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Hora do Açaí</title>
    <!-- Biblioteca para gerar QR Code do PIX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { max-width: 900px; margin: 0 auto; background: #f4f4f5; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        
        header { background-color: #4b0082; color: white; padding: 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 100; }
        .btn-voltar { color: white; text-decoration: none; font-weight: bold; margin-right: 15px; font-size: 1.5rem; }
        
        .container { padding: 30px; background: #fff; min-height: calc(100vh - 75px); }
        
        .item-carrinho { border-bottom: 1px solid #eee; padding: 15px 0; }
        .item-header { display: flex; justify-content: space-between; font-weight: bold; color: #4b0082; margin-bottom: 5px; font-size: 1.1rem; }
        .item-detalhes { font-size: 0.9rem; color: #666; margin-bottom: 10px; line-height: 1.4; }
        .btn-remover { color: #d9534f; background: none; border: none; cursor: pointer; font-weight: bold; }
        
        .secao-form { margin-top: 25px; }
        .secao-form h3 { margin-bottom: 15px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        input, select { width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; }
        
        .btn-finalizar { width: 100%; background: #2e8b57; color: white; padding: 18px; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-finalizar:hover { background: #256f44; }
        
        #resumo-total { font-size: 1.6rem; text-align: right; margin: 20px 0; color: #2e8b57; font-weight: bold; }
        .vazio { text-align: center; color: #777; margin-top: 50px; font-size: 1.1rem; }

        /* Caixa de Pagamento PIX Dinâmica */
        #box-pix {
            background: #f9f9fb;
            border: 2px dashed #4b0082;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }
        #qrcode-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }
        .input-copia-cola {
            background: #fff;
            font-size: 0.85rem;
            text-align: center;
            cursor: pointer;
        }
        .btn-copiar {
            background: #4b0082;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="btn-voltar">←</a>
        <h2>Finalizar Pedido</h2>
    </header>

    <div class="container">
        <div id="lista-itens"></div>

        <div id="resumo-total">Total: R$ 0,00</div>

        <div class="secao-form" id="formulario-entrega">
            <h3>📍 Dados da Entrega</h3>
            <input type="text" id="cli-nome" placeholder="Seu Nome Completo" required>
            <input type="tel" id="cli-whatsapp" placeholder="WhatsApp (DDD + Número)" required>
            <input type="text" id="cli-endereco" placeholder="Rua, Número, Bairro e Ponto de Referência" required>
            
            <h3>💳 Forma de Pagamento</h3>
            <select id="cli-pagamento" onchange="verificarPagamento()">
                <option value="pix">PIX (Com QR Code e Copia e Cola)</option>
                <option value="cartao">Cartão de Crédito/Débito na Entrega</option>
                <option value="dinheiro">Dinheiro na Entrega</option>
            </select>

            <!-- BLOCO DINÂMICO DO PIX -->
            <div id="box-pix">
                <h4 style="color: #4b0082; margin-bottom: 5px;">Pague com PIX Agora</h4>
                <p style="font-size: 0.85rem; color: #555;">Escaneie o QR Code abaixo ou clique no botão para copiar o código.</p>
                
                <div id="qrcode-container"></div>

                <input type="text" id="pix-copia-cola" class="input-copia-cola" readonly value="00020126580014br.gov.bcb.pix... (Gerando PIX)">
                <button type="button" class="btn-copiar" onclick="copiarPix()">Copiar Código PIX</button>
            </div>

            <button class="btn-finalizar" onclick="finalizarPedido()">Concluir Pedido no WhatsApp</button>
        </div>
    </div>

    <script>
        let carrinho = JSON.parse(localStorage.getItem('carrinhoAcai')) || [];
        let totalGlobal = 0;

        function carregarCarrinho() {
            const container = document.getElementById('lista-itens');
            const resumoTotal = document.getElementById('resumo-total');
            const formEntrega = document.getElementById('formulario-entrega');
            
            container.innerHTML = ''; 
            totalGlobal = 0;

            if (carrinho.length === 0) {
                container.innerHTML = '<p class="vazio">Seu carrinho está vazio. 😕<br><br><a href="index.html" style="color: #4b0082; font-weight: bold;">Voltar ao Cardápio</a></p>';
                resumoTotal.innerText = 'Total: R$ 0,00';
                formEntrega.style.display = 'none'; 
                return;
            }

            formEntrega.style.display = 'block';

            carrinho.forEach((item, index) => {
                totalGlobal += item.precoTotal;

                let txtAdicionais = item.adicionais.length > 0 
                    ? item.adicionais.map(a => a.nome).join(', ') 
                    : 'Sem complementos';

                const divItem = document.createElement('div');
                divItem.className = 'item-carrinho';
                divItem.innerHTML = `
                    <div class="item-header">
                        <span>${item.nome} (${item.tamanhoNome})</span>
                        <span>R$ ${item.precoTotal.toFixed(2).replace('.', ',')}</span>
                    </div>
                    <div class="item-detalhes">
                        Complementos: ${txtAdicionais}
                    </div>
                    <button class="btn-remover" onclick="removerItem(${index})">Remover item</button>
                `;
                container.appendChild(divItem);
            });

            resumoTotal.innerText = 'Total: ' + totalGlobal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            verificarPagamento(); // Atualiza o PIX caso esteja selecionado
        }

        function removerItem(index) {
            carrinho.splice(index, 1);
            localStorage.setItem('carrinhoAcai', JSON.stringify(carrinho));
            carregarCarrinho();
        }

        // Função que controla a exibição do QR Code e Copia/Cola do PIX
        function verificarPagamento() {
            const metodo = document.getElementById('cli-pagamento').value;
            const boxPix = document.getElementById('box-pix');

            if (metodo === 'pix') {
                boxPix.style.display = 'block';
                gerarDadosPix(totalGlobal);
            } else {
                boxPix.style.display = 'none';
            }
        }

        // Gera a string padrão do PIX (Payload simulado/exemplo com sua chave ou dados)
        function gerarDadosPix(valor) {
            // Substitua 'suachavepix@email.com' pela sua chave PIX real da loja
            const chavePix = "6dc6a85f-ccda-45c9-8838-85e422073af9"; 
            const nomeRecebedor = "Hora do Acai Americana";
            const cidade = "Americana";
            const valorFormatado = valor.toFixed(2);

            // Payload padrão do Banco Central (BR Code Simplificado)
            // Para testes, geramos um texto estruturado válido para cópia
            const payloadPix = `00020126580014br.gov.bcb.pix0136${chavePix}5204000053039865802BR5925${nomeRecebedor}6009${cidade}62070503***6304`;
            
            document.getElementById('pix-copia-cola').value = payloadPix;

            // Limpa o QR Code anterior e gera um novo
            document.getElementById('qrcode-container').innerHTML = "";
            new QRCode(document.getElementById("qrcode-container"), {
                text: payloadPix,
                width: 180,
                height: 180
            });
        }

        function copiarPix() {
            const inputCopia = document.getElementById('pix-copia-cola');
            inputCopia.select();
            inputCopia.setSelectionRange(0, 99999); // Para celulares
            navigator.clipboard.writeText(inputCopia.value);
            alert("Código PIX Copia e Cola copiado com sucesso! Cole no aplicativo do seu banco.");
        }

        async function finalizarPedido() {
            const nome = document.getElementById('cli-nome').value.trim();
            const whatsapp = document.getElementById('cli-whatsapp').value.trim();
            const endereco = document.getElementById('cli-endereco').value.trim();
            
            const selectPagamento = document.getElementById('cli-pagamento');
            const pagamento = selectPagamento.options[selectPagamento.selectedIndex].text;

            if (!nome || !whatsapp || !endereco) {
                alert("Por favor, preencha todos os dados de entrega para prosseguir!");
                return;
            }

            const btn = document.querySelector('.btn-finalizar');
            btn.innerText = "Processando...";
            btn.disabled = true;

            let pedidoId = 'N/A';
            try {
                const resposta = await fetch('/api/pedidos.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cliente_nome: nome,
                        cliente_telefone: whatsapp,
                        endereco: endereco,
                        forma_pagamento: pagamento,
                        total: totalGlobal,
                        itens: carrinho
                    })
                });

                const resultado = await resposta.json();
                if (resultado.sucesso) {
                    pedidoId = resultado.pedido_id;
                }
            } catch (erro) {
                console.warn("Aviso ao salvar no banco:", erro);
            }

            // ⚠️ COLOQUE AQUI O NÚMERO DA SUA LOJA NO WHATSAPP ⚠️
            const numeroLoja = "5519993857689"; 

            let textoMsg = `🟣 *NOVO PEDIDO #${pedidoId} - HORA DO AÇAÍ* 🟣\n\n`;
            textoMsg += `*Cliente:* ${nome}\n`;
            textoMsg += `*Contato:* ${whatsapp}\n`;
            textoMsg += `*Endereço:* ${endereco}\n\n`;
            textoMsg += `*🛒 ITENS DO PEDIDO:*\n`;

            carrinho.forEach((item, index) => {
                let txtAdicionais = item.adicionais.length > 0 
                    ? item.adicionais.map(a => a.nome).join(', ') 
                    : 'Sem complementos';

                textoMsg += `\n${index + 1}. *${item.nome} (${item.tamanhoNome})*\n`;
                textoMsg += `   ▫️ Adicionais: ${txtAdicionais}\n`;
                textoMsg += `   ▫️ R$ ${item.precoTotal.toFixed(2).replace('.', ',')}\n`;
            });

            textoMsg += `\n➖➖➖➖➖➖➖➖➖➖\n`;
            textoMsg += `*💳 Pagamento:* ${pagamento}\n`;
            textoMsg += `*💰 TOTAL: R$ ${totalGlobal.toFixed(2).replace('.', ',')}*\n`;

            const linkWhatsApp = `https://wa.me/${numeroLoja}?text=${encodeURIComponent(textoMsg)}`;

            localStorage.removeItem('carrinhoAcai');
            window.open(linkWhatsApp, '_blank');
            window.location.href = 'index.html';
        }

        document.addEventListener('DOMContentLoaded', carregarCarrinho);
    </script>
</body>
</html>
