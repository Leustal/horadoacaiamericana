<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do Açaí Americana</title>
    <style>
        :root {
            --primary: #5b0e8d;
            --primary-light: #7b1fa2;
            --primary-soft: #f3e8ff; 
            --primary-soft-hover: #e9d5ff;
            --success: #2e8b57;
            --danger: #d32f2f;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 900px; 
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.08);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 25px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(91, 14, 141, 0.15);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* Banner de Status da Loja (Aberto / Fechado) */
        #status-loja-banner {
            background: #fff;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #edf2f7;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .status-aberto {
            background: #e6f4ea;
            color: var(--success);
        }

        .status-fechado {
            background: #fde8e8;
            color: var(--danger);
        }

        .ponto-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-aberto .ponto-status { background: var(--success); animation: pulse 1.5px infinite; }
        .status-fechado .ponto-status { background: var(--danger); }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 139, 87, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 139, 87, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 139, 87, 0); }
        }

        .categorias-menu {
            display: flex;
            overflow-x: auto;
            background: var(--card-bg);
            padding: 15px 20px;
            border-bottom: 1px solid #edf2f7;
            gap: 12px;
            position: sticky;
            top: 130px;
            z-index: 99;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .categorias-menu::-webkit-scrollbar {
            display: none; 
        }

        .btn-categoria {
            background: #edf2f7;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn-categoria:hover {
            background: #e2e8f0;
            color: var(--primary);
        }

        .btn-categoria.ativo {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(91, 14, 141, 0.3);
        }

        #cardapio-container {
            padding: 25px 20px;
            padding-bottom: 120px;
        }

        .secao-categoria-titulo {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .produto-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .produto-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border-color: rgba(91, 14, 141, 0.1);
        }

        .produto-imagem-container {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            background: #f1f5f9;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e2e8f0;
        }

        .produto-imagem-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .produto-info {
            flex: 1;
        }

        .produto-info h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .produto-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .produto-acao-preco {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .produto-preco {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.95rem;
        }

        .btn-selecionar {
            background: var(--primary-soft);
            color: var(--primary);
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .produto-card:hover .btn-selecionar {
            background: var(--primary-soft-hover);
        }

        /* MODAL */
        #fundo-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(3px);
            z-index: 1000;
        }
        
        #modal-produto {
            position: fixed;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 100%; max-width: 600px;
            background: #fff;
            border-radius: 28px 28px 0 0;
            padding: 30px;
            z-index: 1001;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
        }

        .escondido { display: none !important; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h2 { color: var(--primary); font-size: 1.4rem; }

        .btn-fechar {
            background: #edf2f7; border: none;
            width: 36px; height: 36px; border-radius: 50%;
            font-size: 1.2rem; color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .modal-subtitulo {
            font-size: 1.05rem; font-weight: 700; color: var(--text-main);
            margin: 20px 0 10px 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px;
        }

        .opcao-radio {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; background: #f8fafc; border: 1px solid #e2e8f0;
            border-radius: 12px; margin-bottom: 10px;
        }

        .controle-qtd { display: flex; align-items: center; gap: 12px; }
        .btn-qtd {
            background: var(--primary); color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%; font-weight: bold;
            font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .span-qtd { font-weight: 700; font-size: 1.1rem; min-width: 20px; text-align: center; }

        .input-observacao {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            font-size: 0.95rem;
            color: var(--text-main);
            resize: none;
            margin-top: 5px;
        }
        .input-observacao:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
        }

        .btn-adicionar-carrinho {
            width: 100%; background: var(--primary); color: white;
            padding: 16px; border: none; border-radius: 14px;
            font-size: 1.1rem; font-weight: 700; margin-top: 25px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(91, 14, 141, 0.3);
        }
        .btn-adicionar-carrinho:hover { background: var(--primary-light); }

        /* BARRA DO CARRINHO */
        #barra-carrinho {
            position: fixed; bottom: 20px; left: 50%;
            transform: translateX(-50%); width: calc(100% - 40px); max-width: 860px;
            background: var(--success); color: white; display: flex;
            justify-content: space-between; align-items: center; padding: 16px 24px;
            z-index: 999; border-radius: 16px; box-shadow: 0 10px 25px rgba(46, 139, 87, 0.4);
        }
        .carrinho-info { display: flex; flex-direction: column; font-size: 1.05rem; }
        .carrinho-info span:first-child { font-size: 0.85rem; opacity: 0.9; text-transform: uppercase; }
        .carrinho-info span:last-child { font-weight: 800; font-size: 1.2rem; }
        .btn-ver-carrinho {
            background: white; color: var(--success); border: none;
            padding: 12px 24px; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🟣 Hora do Açaí</h1>
        <p>O melhor açaí da região, fresquinho e montado do seu jeito!</p>
    </header>

    <!-- BANNER DE STATUS DA LOJA -->
    <div id="status-loja-banner">
        <span id="texto-horario" style="color: var(--text-muted);">Horário: 14:00 às 23:00</span>
        <div id="badge-status" class="status-badge status-aberto">
            <span class="ponto-status"></span>
            <span id="label-status">Verificando expediente...</span>
        </div>
    </div>

    <nav class="categorias-menu" id="categorias-menu">
        <button class="btn-categoria ativo">Carregando...</button>
    </nav>

    <main id="cardapio-container">
        <p style="text-align: center; margin-top: 40px; color: var(--text-muted);">Buscando as delícias do cardápio...</p>
    </main>

    <!-- MODAL -->
    <div id="fundo-modal" class="escondido" onclick="fecharModal()"></div>
    <div id="modal-produto" class="escondido">
        <div class="modal-header">
            <h2 id="modal-titulo">Nome do Produto</h2>
            <button onclick="fecharModal()" class="btn-fechar">&times;</button>
        </div>
        <p id="modal-descricao" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px;"></p>
        
        <div class="modal-subtitulo">1. Escolha o Tamanho</div>
        <div id="modal-tamanhos"></div>

        <div id="bloco-complementos">
            <div class="modal-subtitulo">2. Complementos & Adicionais</div>
            <div id="modal-complementos">
                <p style="color: var(--text-muted); font-size: 0.9rem;">Carregando adicionais...</p>
            </div>
        </div>

        <div class="modal-subtitulo">3. Observações do Item</div>
        <textarea id="modal-obs" class="input-observacao" rows="2" placeholder="Ex: Caprichar no xarope, sem leite condensado..."></textarea>

        <button class="btn-adicionar-carrinho">Adicionar ao Carrinho</button>
    </div>

    <!-- BARRA FLUTUANTE -->
    <div id="barra-carrinho" class="escondido">
        <div class="carrinho-info">
            <span id="qtd-itens-carrinho">0 itens</span>
            <span id="total-carrinho">R$ 0,00</span>
        </div>
        <button class="btn-ver-carrinho" onclick="verHabilitadoOuVerCarrinho()">Ver Carrinho 🛒</button>
    </div>

    <script>
        let carrinho = JSON.parse(localStorage.getItem('carrinhoAcai')) || [];
        let lojaAbertaGlobal = true; // Variável de controle de expediente

        // Configuração de Horário de Funcionamento
        function verificarHorarioLoja() {
            const badge = document.getElementById('badge-status');
            const label = document.getElementById('label-status');

            // ⚠️ Defina aqui os horários de funcionamento (Ex: Aberto das 14:00 às 23:59)
            const horaAbertura = 14; 
            const horaFechamento = 23; 

            const agora = new Date();
            const horaAtual = agora.getHours();
            const minutoAtual = agora.getMinutes();

            // Lógica simples de horário (caso queira testar fechado, basta alterar a horaAtual)
            // Aqui consideramos aberto das 14h às 23h59
            const estaAberto = horaAtual >= horaAbertura && horaAtual < horaFechamento;

            lojaAbertaGlobal = estaAberto;

            if (estaAberto) {
                badge.className = "status-badge status-aberto";
                label.innerText = "Loja Aberta • Aceitando Pedidos";
            } else {
                badge.className = "status-badge status-fechado";
                label.innerText = "Loja Fechada no momento";
            }
        }

        async function carregarCardapio() {
            try {
                const resposta = await fetch('/api/cardapio.php');
                const cardapio = await resposta.json();

                const menuCategorias = document.getElementById('categorias-menu');
                const containerCardapio = document.getElementById('cardapio-container');

                menuCategorias.innerHTML = '';
                containerCardapio.innerHTML = '';

                cardapio.forEach((categoria, index) => {
                    const btnCategoria = document.createElement('button');
                    btnCategoria.className = `btn-categoria ${index === 0 ? 'ativo' : ''}`;
                    btnCategoria.innerText = categoria.categoria;
                    
                    btnCategoria.onclick = () => {
                        document.querySelectorAll('.btn-categoria').forEach(b => b.classList.remove('ativo'));
                        btnCategoria.classList.add('ativo');
                        document.getElementById(`categoria-${categoria.id}`).scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    };
                    menuCategorias.appendChild(btnCategoria);

                    const secao = document.createElement('div');
                    secao.id = `categoria-${categoria.id}`;
                    secao.style.paddingTop = '130px'; 
                    secao.style.marginTop = '-110px'; 
                    
                    secao.innerHTML = `<div class="secao-categoria-titulo">${categoria.categoria}</div>`;

                    categoria.produtos.forEach(produto => {
                        const menorPreco = Math.min(...produto.tamanhos.map(t => t.preco));
                        const precoFormatado = menorPreco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                        const imagemUrl = produto.imagem || 'https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?auto=format&fit=crop&w=150&q=80';

                        const cardProduto = document.createElement('div');
                        cardProduto.className = 'produto-card';
                        cardProduto.innerHTML = `
                            <div class="produto-imagem-container">
                                <img src="${imagemUrl}" alt="${produto.nome}">
                            </div>
                            <div class="produto-info">
                                <h3>${produto.nome}</h3>
                                <p>${produto.descricao}</p>
                            </div>
                            <div class="produto-acao-preco">
                                <span class="produto-preco">A partir de ${precoFormatado}</span>
                                <button class="btn-selecionar">Adicionar</button>
                            </div>
                        `;
                        
                        cardProduto.onclick = () => abrirModal(produto, categoria.categoria);
                        secao.appendChild(cardProduto);
                    });

                    containerCardapio.appendChild(secao);
                });

            } catch (erro) {
                console.error("Erro ao carregar o cardápio:", erro);
                document.getElementById('cardapio-container').innerHTML = '<p style="color: red; text-align: center;">Erro ao carregar o cardápio.</p>';
            }
        }

        async function abrirModal(produto, nomeCategoria) {
            document.getElementById('modal-titulo').innerText = produto.nome;
            document.getElementById('modal-descricao').innerText = produto.descricao;
            document.getElementById('modal-obs').value = ''; 
            
            const divTamanhos = document.getElementById('modal-tamanhos');
            divTamanhos.innerHTML = ''; 

            produto.tamanhos.forEach((t, index) => {
                const label = document.createElement('label');
                label.className = 'opcao-radio';
                label.innerHTML = `
                    <span style="font-weight: 600;">
                        <input type="radio" name="tamanho" value="${t.id}" ${index === 0 ? 'checked' : ''} style="margin-right: 8px;">
                        ${t.tamanho}
                    </span>
                    <strong style="color: var(--primary);">+ R$ ${t.preco.toFixed(2).replace('.', ',')}</strong>
                `;
                divTamanhos.appendChild(label);
            });

            const divComplementos = document.getElementById('modal-complementos');
            const aceitaComplementos = nomeCategoria && (
                nomeCategoria.toLowerCase().includes('açaí') || 
                nomeCategoria.toLowerCase().includes('acai') || 
                nomeCategoria.toLowerCase().includes('milkshake')
            );

            if (!aceitaComplementos) {
                document.getElementById('bloco-complementos').style.display = 'none';
                divComplementos.innerHTML = '';
            } else {
                document.getElementById('bloco-complementos').style.display = 'block';
                divComplementos.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">Carregando adicionais...</p>';

                try {
                    const resposta = await fetch('/api/adicionais.php');
                    const adicionais = await resposta.json();
                    
                    divComplementos.innerHTML = ''; 
                    
                    adicionais.forEach(add => {
                        const precoAdd = parseFloat(add.preco);
                        const txtPreco = precoAdd > 0 ? `+ R$ ${precoAdd.toFixed(2).replace('.', ',')}` : 'Grátis';

                        const divAdicional = document.createElement('div');
                        divAdicional.className = 'opcao-radio';
                        divAdicional.innerHTML = `
                            <div>
                                <span style="font-weight: 600;">${add.nome}</span><br>
                                <small style="color: var(--text-muted);">${txtPreco}</small>
                            </div>
                            <div class="controle-qtd">
                                <button type="button" class="btn-qtd" onclick="mudarQtdAdicional('${add.id}', -1)">-</button>
                                <span class="span-qtd" id="qtd-add-${add.id}" data-preco="${precoAdd}">0</span>
                                <button type="button" class="btn-qtd" onclick="mudarQtdAdicional('${add.id}', 1)">+</button>
                            </div>
                        `;
                        divComplementos.appendChild(divAdicional);
                    });

                } catch (erro) {
                    divComplementos.innerHTML = '<p style="color: red;">Erro ao carregar os complementos.</p>';
                }
            }

            const btnAdicionar = document.querySelector('.btn-adicionar-carrinho');
            btnAdicionar.onclick = () => {
                const tamanhoSelecionado = document.querySelector('input[name="tamanho"]:checked');
                const tamanhoId = tamanhoSelecionado.value;
                const tamanhoNome = tamanhoSelecionado.closest('label').querySelector('span').innerText.trim();
                const tamanhoPreco = produto.tamanhos.find(t => t.id == tamanhoId).preco;
                const observacao = document.getElementById('modal-obs').value.trim();

                let adicionais = [];
                let valorAdicionais = 0;

                if (aceitaComplementos) {
                    const spansQtd = document.querySelectorAll('.span-qtd');
                    spansQtd.forEach(span => {
                        const qtd = parseInt(span.innerText);
                        if (qtd > 0) {
                            const addId = span.id.replace('qtd-add-', '');
                            const addNome = span.closest('.opcao-radio').querySelector('span').innerText;
                            const precoUnitario = parseFloat(span.getAttribute('data-preco'));
                            
                            adicionais.push({
                                id: addId,
                                nome: `${qtd}x ${addNome}`,
                                preco: precoUnitario * qtd
                            });
                            valorAdicionais += precoUnitario * qtd;
                        }
                    });
                }

                const itemCarrinho = {
                    produtoId: produto.id,
                    nome: produto.nome,
                    tamanhoId: tamanhoId,
                    tamanhoNome: tamanhoNome,
                    adicionais: adicionais,
                    observacao: observacao,
                    precoTotal: tamanhoPreco + valorAdicionais,
                    quantidade: 1
                };

                carrinho.push(itemCarrinho);
                localStorage.setItem('carrinhoAcai', JSON.stringify(carrinho));
                
                atualizarBarraCarrinho();
                fecharModal();
            };

            document.getElementById('fundo-modal').classList.remove('escondido');
            document.getElementById('modal-produto').classList.remove('escondido');
        }

        function mudarQtdAdicional(id, delta) {
            const span = document.getElementById(`qtd-add-${id}`);
            let atual = parseInt(span.innerText);
            atual += delta;
            if (atual < 0) atual = 0;
            span.innerText = atual;
        }

        function fecharModal() {
            document.getElementById('fundo-modal').classList.add('escondido');
            document.getElementById('modal-produto').classList.add('escondido');
        }

        function atualizarBarraCarrinho() {
            const barra = document.getElementById('barra-carrinho');
            if (carrinho.length === 0) {
                barra.classList.add('escondido');
                return;
            }

            let total = 0;
            let qtdTotalItens = 0;
            carrinho.forEach(item => {
                let q = item.quantidade || 1;
                total += item.precoTotal;
                qtdTotalItens += q;
            });

            const textoItem = qtdTotalItens === 1 ? 'item' : 'itens';
            document.getElementById('qtd-itens-carrinho').innerText = `${qtdTotalItens} ${textoItem}`;
            document.getElementById('total-carrinho').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            
            barra.classList.remove('escondido');
        }

        function verHabilitadoOuVerCarrinho() {
            if (!lojaAbertaGlobal) {
                alert("Atenção: No momento a nossa loja está fechada. Você pode montar seu carrinho, mas os pedidos só serão enviados quando abrirmos!");
            }
            window.location.href = 'checkout.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            verificarHorarioLoja();
            carregarCardapio();
            atualizarBarraCarrinho();
        });
    </script>
</body>
</html>
